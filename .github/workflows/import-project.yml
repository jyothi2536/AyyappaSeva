name: Import AyyappaSeva project

on:
  push:
    paths:
      - "ayyappa-source.partad"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reconstruct and import project
        run: |
          cat ayyappa-source.part* > ayyappa-source.tar.gz
          tar -xzf ayyappa-source.tar.gz
          rm -f ayyappa-source.part* ayyappa-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete AyyappaSeva project"
          git push
