<script>
  // One QR code for everyone: send each phone to its own store.
  var IOS = "https://apps.apple.com/us/app/atlanta-ayyappa-temple/id6807055617";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.varktraditions.ayyappaseva";
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (isIOS) location.replace(IOS);
  else if (/Android/i.test(ua)) location.replace(ANDROID);
</script>
